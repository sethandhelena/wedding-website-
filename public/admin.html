<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wedding Admin | Seth & Helena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="login-card">
      <img src="assets/seth-helena-monogram.png" alt="Seth and Helena monogram" class="admin-monogram">
      <p class="eyebrow">Private Administration</p>
      <h1>Wedding Website Admin</h1>
      <p>Sign in to manage RSVPs, registry items, and journal posts.</p>
      <form id="loginForm">
        <label>Admin password<input id="adminPassword" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign In</button>
        <p id="loginMessage" class="status"></p>
      </form>
    </section>

    <section id="dashboardView" hidden>
      <header class="admin-header">
        <div>
          <p class="eyebrow">Seth & Helena</p>
          <h1>Wedding Admin</h1>
        </div>
        <div class="header-actions">
          <a href="index.html" target="_blank" rel="noopener">View Website</a>
          <button id="logoutButton" type="button" class="secondary">Log Out</button>
        </div>
      </header>

      <div class="stats" id="stats"></div>

      <nav class="tabs" aria-label="Admin sections">
        <button class="tab active" data-tab="rsvps">RSVPs</button>
        <button class="tab" data-tab="registry">Registry</button>
        <button class="tab" data-tab="journal">Journal</button>
      </nav>

      <section class="panel active" id="panel-rsvps">
        <div class="panel-heading">
          <div><p class="eyebrow">Guest Responses</p><h2>RSVPs</h2></div>
          <a class="button-link" href="/api/admin/rsvps.csv">Export CSV</a>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Name</th><th>Attendance</th><th>Guests</th><th>Meal</th><th>Email</th><th>Submitted</th></tr></thead><tbody id="rsvpRows"></tbody></table></div>
      </section>

      <section class="panel" id="panel-registry">
        <div class="panel-heading"><div><p class="eyebrow">Editable Gifts</p><h2>Registry</h2></div><button id="newRegistryButton" type="button">Add Registry Item</button></div>
        <form id="registryForm" class="editor" hidden>
          <input type="hidden" name="id">
          <div class="grid-two">
            <label>Store<select name="store"><option value="target">Target</option><option value="crate">Crate & Barrel</option><option value="honeymoon">Honeymoon</option></select></label>
            <label>Status<select name="status"><option value="available">Available</option><option value="purchased">Purchased</option></select></label>
            <label>Title<input name="title" required></label>
            <label>Price<input name="price" placeholder="$129.95 or Any Amount"></label>
            <label>Image class<input name="image_class" placeholder="gift-image-one"></label>
            <label>Image URL<input name="image_url" type="url" placeholder="https://..."></label>
            <label>Gift URL<input name="gift_url" type="url" placeholder="https://..."></label>
            <label>Sort order<input name="sort_order" type="number" value="0"></label>
          </div>
          <label>Description<textarea name="description" rows="4"></textarea></label>
          <label class="check"><input name="featured" type="checkbox"> Most Wanted / featured</label>
          <div class="editor-actions"><button type="submit">Save Item</button><button id="cancelRegistry" class="secondary" type="button">Cancel</button></div>
          <p id="registryMessage" class="status"></p>
        </form>
        <div id="registryList" class="item-list"></div>
      </section>

      <section class="panel" id="panel-journal">
        <div class="panel-heading"><div><p class="eyebrow">Editable Content</p><h2>Journal</h2></div><button id="newJournalButton" type="button">Add Journal Post</button></div>
        <form id="journalForm" class="editor" hidden>
          <input type="hidden" name="id">
          <div class="grid-two">
            <label>Title<input name="title" required></label>
            <label>Category<input name="category"></label>
            <label>Display date<input name="post_date" placeholder="October 4, 2026"></label>
            <label>Sort order<input name="sort_order" type="number" value="0"></label>
            <label>Image class<input name="image_class" placeholder="journal-one"></label>
            <label>Image URL<input name="image_url" type="url" placeholder="https://..."></label>
          </div>
          <label>Excerpt<textarea name="excerpt" rows="3"></textarea></label>
          <label>Content<textarea name="content" rows="7"></textarea></label>
          <label class="check"><input name="published" type="checkbox" checked> Published</label>
          <div class="editor-actions"><button type="submit">Save Post</button><button id="cancelJournal" class="secondary" type="button">Cancel</button></div>
          <p id="journalMessage" class="status"></p>
        </form>
        <div id="journalList" class="item-list"></div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
